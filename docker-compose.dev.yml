services:
  db:
    image: postgres:16-alpine
    container_name: shiftworkr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shiftworkr}
      POSTGRES_USER: ${POSTGRES_USER:-shiftworkr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shiftworkr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-shiftworkr}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
