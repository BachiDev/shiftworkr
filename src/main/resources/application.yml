spring:
  application:
    name: shiftworkr
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    validate-on-migrate: true
    # Deliberately false: every environment starts from versioned V1 migrations,
    # never by baselining a pre-existing schema.
    baseline-on-migrate: false

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
