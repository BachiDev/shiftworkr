spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:shiftworkr}
    username: ${POSTGRES_USER:shiftworkr}
    password: ${POSTGRES_PASSWORD:shiftworkr}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  # No spring.flyway.url here on purpose: Flyway follows the primary DataSource,
  # which lets @ServiceConnection tests migrate their container. Only prod needs
  # a separate FLYWAY_URL (Neon direct endpoint, bypassing PgBouncer).
  flyway:
    locations: classpath:db/migration

vaadin:
  productionMode: false
